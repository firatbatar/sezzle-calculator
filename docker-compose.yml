services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "8000"
      ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 1s
    networks:
      - calculator
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CALCULATOR_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - calculator
    restart: unless-stopped

networks:
  calculator:
